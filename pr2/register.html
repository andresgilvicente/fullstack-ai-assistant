<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        
        <div class="site-nav">
            <a href="login.html">Iniciar Sesion</a>
            <a href="register.html" class="active">Registro</a>
        </div>
    </header>

    <main class="content">
        <section class="card">
            <h1>Crear cuenta</h1>

            <div id="errors"></div>

            <form id="register-form" action="#" method="POST">
                <div class="form-field">
                    <label for="username">*Usuario:</label>
                    <input type="text" id="username" name="username" maxlength="150" required>
                </div>

                <div class="form-field">
                    <label for="email">*Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-field">
                    <label for="first_name">Nombre:</label>
                    <input type="text" id="first_name" name="first_name" maxlength="150">
                </div>

                <div class="form-field">
                    <label for="last_name">Apellidos:</label>
                    <input type="text" id="last_name" name="last_name" maxlength="150">
                </div>

                <div class="form-field">
                    <label for="password">*Password:</label>
                    <input type="password" id="password" name="password" required>
                    <small>Mas de 8 caracteres, al menos 1 mayuscula y 1 minuscula.</small>
                </div>

                <div class="form-field">
                    <label for="password2">*Repetir password:</label>
                    <input type="password" id="password2" name="password2" required>
                </div>

                
                <button type="submit">Registrarse</button>
            </form>

            <p class="form-footer">Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
        </section>
    </main>

    <footer class="footer">
        <p>Agile But Fragile</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
