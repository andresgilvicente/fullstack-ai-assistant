services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: assistant-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: assistant-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-assistant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-assistant_password}
      - POSTGRES_DB=${POSTGRES_DB:-assistant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assistant-backend
    volumes:
      # Mount the source tree so that code changes are picked up by the
      # development server without rebuilding the image.
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=true
      - POSTGRES_DB=${POSTGRES_DB:-assistant_db}
      - POSTGRES_USER=${POSTGRES_USER:-assistant}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-assistant_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-development-only-key}
      - DEBUG=${DEBUG:-True}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: assistant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job that pulls the models listed in OLLAMA_MODELS.
  ollama-init:
    image: docker.io/ollama/ollama:latest
    container_name: assistant-ollama-init
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODELS=${OLLAMA_MODELS:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling models: $$OLLAMA_MODELS"
        for model in $$(echo $$OLLAMA_MODELS | tr ',' ' '); do
          echo "Pulling model: $$model"
          ollama pull $$model
        done
        echo "All models pulled successfully"
    restart: "no"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
